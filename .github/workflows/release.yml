# release.yml — on push to main, build the single deployment image and push it to GHCR, then deploy
# to Fly. This is separate from ci.yml (the test gate); it does not touch it. The deploy job no-ops
# cleanly until the owner adds a FLY_API_TOKEN repo secret.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: build & push image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/abheet19/weft
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The public origin the bundle talks to. Match this to fly.toml's app host.
          build-args: |
            VITE_WEFT_WS=wss://weft-abheet.fly.dev/ws

  # `secrets` cannot be read inside an `if:` (GitHub does not expose that context there), so a tiny
  # gate job maps the secret to an output and the deploy job keys off that — this is what makes the
  # deploy no-op cleanly until the owner adds FLY_API_TOKEN, and start working the moment they do.
  gate:
    name: check for deploy token
    runs-on: ubuntu-latest
    outputs:
      have_token: ${{ steps.check.outputs.have_token }}
    steps:
      - id: check
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: echo "have_token=${FLY_API_TOKEN:+true}" >> "$GITHUB_OUTPUT"

  deploy:
    name: deploy to Fly
    needs: [image, gate]
    if: ${{ needs.gate.outputs.have_token == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@1.5
        with:
          version: 0.3.129

      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
